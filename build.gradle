plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "herzium" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Mod Menu is only needed to compile ModMenuIntegration; it must not reach
    // the runtime classpath, and its transitive dependencies must not leak into
    // this build. version/build.gradle expresses the same intent with Loom's
    // modCompileOnly. That configuration does not exist here: the root project
    // applies the "net.fabricmc.fabric-loom" plugin, which -- unlike the
    // "fabric-loom" plugin the multiversion matrix uses -- never creates the
    // mod* configurations. Swapping the plugin id is not a local change: the
    // full plugin also demands a Java 25 Gradle daemon and an explicit
    // "mappings" dependency this build has never declared. See M-02 in
    // docs/AUDIT-1.9.3.md.
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }
}

processResources {
    def modVersion = project.version
    def minecraftVersion = project.minecraft_version.toString()
    def javaVersion = project.java_version
    def modMenuVersion = project.modmenu_version

    // "minecraft": "26.1.2" is an exact match, so the jar refuses to load on
    // 26.1.3 even though nothing it touches has changed. Widen it to the patch
    // series and stop at the next minor, where Mojang is free to move the
    // targets these mixins bind to.
    //
    // The range is built here rather than written into fabric.mod.json because
    // that file is shared verbatim with the multiversion matrix, which feeds it
    // sixteen different Minecraft versions. A literal "<26.2" in the template
    // would be wrong for every 1.21.x variant and impossible for the 26.2 one.
    def minecraftMinor = minecraftVersion.tokenize('.')
    def minecraftUpperBound = "${minecraftMinor[0]}.${(minecraftMinor[1] as int) + 1}"
    def minecraftVersionRange = ">=${minecraftVersion} <${minecraftUpperBound}"

    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersionRange
    inputs.property "java_version", javaVersion
    inputs.property "modmenu_version", modMenuVersion

    filesMatching("fabric.mod.json") {
        expand(
                "version": modVersion,
                "minecraft_version": minecraftVersionRange,
                "java_version": javaVersion,
                "modmenu_version": modMenuVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "LICENSE_herzium" }
    }

    manifest {
        attributes(
                'Implementation-Title': 'Herzium',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'zymekoh'
        )
    }
}

// checksums.txt used to be maintained by hand and drifted two releases behind
// the code: it still listed the sixteen 1.8.7 jars while gradle.properties said
// 1.9.3. It is generated from the real build output now, so it cannot disagree
// with what was actually produced. The multiversion jars are not covered here;
// only version/build-all.ps1 knows how to produce those, and it is outside this
// build. See M-09 in docs/AUDIT-1.9.3.md.
tasks.register("herziumChecksums") {
    group = "verification"
    description = "Writes SHA-256 sums for the jars this build produced."

    def libsDirectory = layout.buildDirectory.dir("libs")
    def checksumFile = layout.projectDirectory.file("docs/checksums.txt")
    def modVersion = project.version.toString()
    def minecraftVersion = project.minecraft_version.toString()

    dependsOn tasks.named("assemble")
    inputs.dir(libsDirectory).withPropertyName("libs")
    outputs.file(checksumFile).withPropertyName("checksums")

    doLast {
        def jars = libsDirectory.get().asFile.listFiles()
                ?.findAll { it.name.endsWith(".jar") && !it.name.endsWith("-sources.jar") }
                ?.sort { it.name } ?: []

        def digest = java.security.MessageDigest.getInstance("SHA-256")
        def lines = ["# Herzium ${modVersion} -- root build, Minecraft ${minecraftVersion}.",
                     "# Generated by the herziumChecksums Gradle task; do not edit by hand.",
                     "# Multiversion jars are not listed here: they are produced by",
                     "# version/build-all.ps1, which is a separate build.",
                     ""]

        jars.each { jar ->
            digest.reset()
            def hash = digest.digest(jar.bytes).encodeHex().toString()
            lines << "${hash}  ${jar.name}"
        }

        checksumFile.asFile.parentFile.mkdirs()
        checksumFile.asFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
        logger.lifecycle("herziumChecksums: ${jars.size()} jar(s) -> ${checksumFile.asFile}")
    }
}

tasks.named("build") {
    finalizedBy tasks.named("herziumChecksums")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

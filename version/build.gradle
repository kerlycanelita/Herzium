plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def targetMinecraft = project.minecraft_version.toString()
def minecraft121 = targetMinecraft.startsWith('1.21')
def classicInputVersions = [
        '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4',
        '1.21.5', '1.21.6', '1.21.7', '1.21.8'
] as Set
def classicInput = classicInputVersions.contains(targetMinecraft)
def modernButton = ['1.21.9', '1.21.10'].contains(targetMinecraft)
// ItemTags.SPEARS lands in 1.21.11; before that the constant does not exist and
// the line that reads it has to go. Spears are WEAPON_ENCHANTABLE on those
// versions, so the classification is unchanged either way.
def spearTag = targetMinecraft == '1.21.11'
// Mojang renamed ResourceLocation to Identifier in 1.21.11. The shared sources
// use the new name, so every 1.21.x target below that one needs it renamed
// back; without this the 1.21.10 build never compiled at all.
def legacyResourceLocation = minecraft121 && targetMinecraft != '1.21.11'
def javaRelease = minecraft121 ? 21 : 25

version = project.mod_version
group = project.maven_group

layout.buildDirectory = layout.projectDirectory.dir("${targetMinecraft}/build")

base {
    archivesName = "herzium-${targetMinecraft}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'herzium' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def generatedClientSources = layout.buildDirectory.dir('generated/sources/herzium/client')

tasks.register('generateHerziumClientSources', Sync) {
    from('../src/client/java') {
        if (minecraft121) {
            // Only CombatItemClassifier is overlaid: 1.21.x has no
            // ItemStack.typeHolder(). MinecraftMixin used to be overlaid too
            // and silently rotted two releases behind -- the 1.21.x jars kept
            // shipping a lifecycle hook that predated the fail-closed action
            // boundaries and the settled-session world check. Everything it
            // touches (startUseItem, startAttack, continueAttack, setScreen,
            // runAllTasks inside runTick, LevelLoadTracker.LEVEL_LOAD_CLOSE_DELAY_MS)
            // exists on 1.21.10 and 1.21.11, so the shared file is compiled
            // here directly and a future 26.x-only API breaks this build loudly
            // instead of quietly downgrading the legacy jars.
            exclude '**/render/CombatItemClassifier.java'
        }
        if (classicInput) {
            exclude '**/AnimatedPurpleButton.java'
            exclude '**/ItemInHandRendererMixin.java'
            exclude '**/LoadingOverlayMixin.java'
        }
        if (modernButton) {
            exclude '**/AnimatedPurpleButton.java'
        }
        if (minecraft121) {
            filteringCharset = 'UTF-8'
            filter { String line ->
                String transformed = line
                        .replace('GuiGraphicsExtractor', 'GuiGraphics')
                        .replace('extractContents', 'renderContents')
                        .replace('extractDefaultLabel', 'renderDefaultLabel')
                        .replace('extractBackground', 'renderBackground')
                        .replace('extractRenderState', 'render')
                        .replace('extractPanorama', 'renderPanorama')
                        .replace('extractCrosshair', 'renderCrosshair')
                        .replace('extractItemHotbar', 'renderItemHotbar')
                        .replace('graphics.centeredText(', 'graphics.drawCenteredString(')
                        .replace('graphics.text(', 'graphics.drawString(')
                if (targetMinecraft == '1.21' || targetMinecraft == '1.21.1') {
                    transformed = transformed.replace('.getDeltaTracker()', '.getTimer()')
                }
                if (modernButton) {
                    transformed = transformed.replace('.screen.init(', '.screen.resize(this.minecraft,')
                }
                if (legacyResourceLocation) {
                    transformed = transformed.replaceAll(/\bIdentifier\b/, 'ResourceLocation')
                }
                transformed = transformed
                        .replace('require = 4', 'require = 0')
                        .replace('require = 2', 'require = 0')
                return transformed
            }
        }
    }

    if (minecraft121) {
        from('src/client/common121') {
            if (!spearTag) {
                filteringCharset = 'UTF-8'
                filter { String line -> line.contains('herzium:spears-tag') ? null : line }
            }
        }
    }
    if (classicInput) {
        from('src/client/classic')
    }
    if (modernButton) {
        from('src/client/modern-button')
    }
    into(generatedClientSources)
}

sourceSets {
    main {
        java.srcDirs = ['../src/main/java']
        resources.srcDirs = ['../src/main/resources']
    }
    client {
        java.srcDirs = [generatedClientSources]
        resources.srcDirs = ['../src/client/resources']
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    if (minecraft121) {
        mappings loom.officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', targetMinecraft
    inputs.property 'java_version', javaRelease
    inputs.property 'modmenu_version', project.modmenu_version

    filesMatching('fabric.mod.json') {
        expand(
                'version': project.version,
                'minecraft_version': targetMinecraft,
                'java_version': javaRelease,
                'modmenu_version': project.modmenu_version
        )
    }
}

tasks.named('processClientResources') {
    if (minecraft121) {
        filesMatching('herzium.client.mixins.json') {
            filteringCharset = 'UTF-8'
            filter { String line ->
                line.replace('"compatibilityLevel": "JAVA_25"', '"compatibilityLevel": "JAVA_21"')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

tasks.named('compileClientJava') {
    dependsOn tasks.named('generateHerziumClientSources')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    withSourcesJar()
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateHerziumClientSources')
}

jar {
    from('../LICENSE') {
        rename { 'LICENSE_herzium' }
    }

    manifest {
        attributes(
                'Implementation-Title': 'Herzium',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'zymekoh',
                'Minecraft-Version': targetMinecraft
        )
    }
}

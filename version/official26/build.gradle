plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def targetMinecraft = project.minecraft_version.toString()
def splitGui = ['26.2', '26.3'].contains(targetMinecraft)
def extractedHands = targetMinecraft == '26.3'

version = project.mod_version
group = project.maven_group

layout.buildDirectory = layout.projectDirectory.dir("../${targetMinecraft}/build")

base {
    archivesName = "herzium-${targetMinecraft}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'herzium' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def generatedClientSources = layout.buildDirectory.dir('generated/sources/herzium/client')

tasks.register('generateHerzium26ClientSources', Sync) {
    // Blocks fenced by herzium:26.2-drop-start / -end are removed for 26.2 and
    // replaced by a file under src/26.2. A plain string swap cannot express
    // "this whole hook moved to another class", which is what 26.2 did to
    // Minecraft.setScreen.
    def dropping = false
    // Blocks fenced by herzium:26.3-drop-start / -end are removed for 26.3:
    // it drops through MultiPlayerGameMode.dropItem, so the LocalPlayer.drop
    // hook has no target there and would fail the mixin config at launch.
    def dropping263 = false

    from('../../src/client/java') {
        if (extractedHands) {
            exclude '**/ItemInHandRendererMixin.java'
        }
        filteringCharset = 'UTF-8'
        filter { String line ->
            String transformed = line
            if (transformed.contains('herzium:26.3-drop-start')) {
                dropping263 = targetMinecraft == '26.3'
                return null
            }
            if (transformed.contains('herzium:26.3-drop-end')) {
                dropping263 = false
                return null
            }
            if (dropping263) {
                return null
            }
            if (!splitGui) {
                return transformed
            }
            if (transformed.contains('herzium:26.2-drop-start')) {
                dropping = true
                return null
            }
            if (transformed.contains('herzium:26.2-drop-end')) {
                dropping = false
                return null
            }
            if (dropping) {
                return null
            }
            if (transformed.contains('minecraft.getWindow().updateVsync(false);')) {
                return null
            }
            return transformed
                    // Mojang renamed the first-person hand submission entry point in 26.2.
                    .replace('renderHandsWithItems', 'submitHandsWithItems')
                    .replace('renderArmWithItem', 'submitArmWithItem')
                    // Minecraft.handleKeybinds stopped reading keySocialInteractions in
                    // 26.2: that key (with chat, command, advancements and toggleGui)
                    // moved into Gui.handleKeybinds, which 26.2 calls BEFORE the hotbar
                    // slot loop instead of after it. HotbarOrderMixin seals the finished
                    // slot pass at that field read and declares require = 1, so on 26.2
                    // the injection finds nothing and the whole mixin config fails at
                    // launch. keyInventory is the same place in the new order: the first
                    // screen-opening key handled after Inventory.setSelectedSlot, and it
                    // appears exactly once in the method.
                    .replace(
                            'Lnet/minecraft/client/Options;keySocialInteractions:Lnet/minecraft/client/KeyMapping;',
                            'Lnet/minecraft/client/Options;keyInventory:Lnet/minecraft/client/KeyMapping;')
                    // The 26.1 HUD implementation moved from Gui into Hud in 26.2.
                    .replace('import net.minecraft.client.gui.Gui;', 'import net.minecraft.client.gui.Hud;')
                    .replace('Gui.class', 'Hud.class')
                    .replace('this.minecraft.getOverlay()', 'this.minecraft.gui.overlay()')
                    .replace('minecraft.getOverlay()', 'minecraft.gui.overlay()')
                    .replace('this.minecraft.setOverlay(', 'this.minecraft.gui.setOverlay(')
                    .replace('minecraft.setOverlay(', 'minecraft.gui.setOverlay(')
                    .replace('this.minecraft.setScreen(', 'this.minecraft.gui.setScreen(')
                    .replace('minecraft.setScreen(', 'minecraft.gui.setScreen(')
                    .replace('this.minecraft.screen', 'this.minecraft.gui.screen()')
                    .replace('minecraft.screen', 'minecraft.gui.screen()')
        }
    }

    // Not filtered: in 26.2 Gui and Hud are different classes, and the filter
    // above rewrites Gui to Hud for the HUD mixins. GuiScreenMixin wants the
    // real Gui.
    if (splitGui) {
        from('src/26.2')
    }
    if (extractedHands) {
        from('src/26.3')
    }

    into(generatedClientSources)
}

sourceSets {
    main {
        java.srcDirs = ['../../src/main/java']
        resources.srcDirs = ['../../src/main/resources']
    }
    client {
        java.srcDirs = [generatedClientSources]
        resources.srcDirs = ['../../src/client/resources']
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', targetMinecraft
    inputs.property 'java_version', 25
    inputs.property 'modmenu_version', project.modmenu_version

    filesMatching('fabric.mod.json') {
        expand(
                'version': project.version,
                'minecraft_version': targetMinecraft,
                'java_version': 25,
                'modmenu_version': project.modmenu_version
        )
    }
}

tasks.named('processClientResources') {
    if (splitGui) {
        filesMatching('herzium.client.mixins.json') {
            filteringCharset = 'UTF-8'
            filter { String line ->
                line.contains('"MinecraftMixin"')
                        ? line + System.lineSeparator() + line.replace('MinecraftMixin', 'GuiScreenMixin')
                        : line
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('compileClientJava') {
    dependsOn tasks.named('generateHerzium26ClientSources')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateHerzium26ClientSources')
}

jar {
    from('../../LICENSE') {
        rename { 'LICENSE_herzium' }
    }

    manifest {
        attributes(
                'Implementation-Title': 'Herzium',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'zymekoh',
                'Minecraft-Version': targetMinecraft
        )
    }
}
